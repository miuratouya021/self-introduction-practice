<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>自己紹介-三浦龍弥</title>
</head>

<body>

    <h1>自己紹介</h1>

    <h2>プロフィール</h2>

    <p>名前: 三浦龍弥</p>
    <p>年齢: 24歳</p>
    <p>出身地: 宮城県</p>
    <p>趣味: 読書</p>

    <h2>好きなもの</h2>
    <ul>
        <li>ラーメン</li>
        <li>中華料理</li>
        <li>焼肉</li>
    </ul>

    <h2>今年の目標</h2>
    <ol>
        <li>スクールの教材を6~7割おわらせる</li>
        <li>厄年だから体調や周りに注意する</li>
        <li>人生を楽しむ</li>
    </ol>

    <h2>リンク</h2>
    <a href="https://github.com/miuratouya021/" target="_blank">私のGithub</a>

    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400">

    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">

        <div>
            <label for="contact_name">お名前:</label>
            <input type="text" id="contact_name" name="name" required>
        </div>

        <div>
            <label for="category_name">お問い合わせ種別:</label>
            <select id="category_name" name="category">
                <option value="">-- 選択してください --</option>
                <option value="general">一般的なお問い合わせ</option>
                <option value="opinion">ご意見・ご要望</option>
            </select>
        </div>

        <div>
            <label for="message_name">お問い合わせ内容:</label>
            <textarea id="message_name" name="message" rows="5" required></textarea>
        </div>
        <div>
            <button type="submit">送信する</button>
        </div>
    </form>

</body>

</html>
